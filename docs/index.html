<!DOCTYPE html>
<html>
<head>
  <!--
    ВАЖНО: не трогай эту строку. Flutter сам подставит сюда значение
    из --base-href при сборке (например, "/vessel-assist/").
  -->
  <base href="/vessel-assist/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vessel Assist — помощник для моряков: формы, расчёты, логи, документы.">

  <!-- Критично для корректного масштаба и «чёлки» на iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA: цвет адресной строки/статусбара -->
  <meta name="theme-color" content="#0A1628">
  <link rel="manifest" href="manifest.json">

  <!-- PWA: iOS / Safari -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vessel Assist">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- iOS: не превращать цифры в телефоны-ссылки -->
  <meta name="format-detection" content="telephone=no">

    <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vessel Assist</title>

  <!-- PWA / iOS: убираем "резинку" прокрутки и двойные тапы -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background: #050B14;
    }
    /* Убираем задержку 300мс и двойной зум по тапу */
    * {
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <!-- Сплэш, пока Flutter грузится (1–2 сек). Удаляется автоматически. -->
  <div id="loading" style="
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0A1628;
    color: #D4A537;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 18px;
    letter-spacing: 0.5px;
    z-index: 9999;
  ">
    Vessel Assist…
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
